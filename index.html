<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Ønivers Pixel de Saik's L'Ønirique</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts pour un style rétro / pixel / moderne -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <header class="hero-header">
        <div class="container">
            <h1 class="glitch-title">L'Ønivers Pixel</h1>
            <p class="subtitle">de Saik's L'Ønirique</p>
            
            <div class="nav-modes">
                <button id="btn-mode-jeux" class="active">🎮 Espace Jeux</button>
                <button id="btn-mode-admin">⚙️ Gestion / Admin</button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Section Liste des Jeux -->
        <section id="section-jeux" class="content-section active">
            <div class="search-filter">
                <input type="text" id="searchInput" placeholder="Rechercher un jeu dans l'ønivers...">
            </div>
            <div id="gamesGrid" class="games-grid">
                <!-- Les cartes de jeux seront injectées ici par JavaScript -->
            </div>
        </section>

        <!-- Section Administration / Gestion -->
        <section id="section-admin" class="content-section">
            <div class="admin-panel">
                <h2>Portail d'Administration de l'Ønivers</h2>
                <p>Ajoutez ou modifiez les jeux référencés dans votre espace personnel.</p>
                
                <form id="gameForm">
                    <input type="text" id="gameTitle" placeholder="Nom du jeu" required>
                    <input type="text" id="gameCategory" placeholder="Catégorie (MMO, Coop, RPG...)" required>
                    <input type="text" id="gameImage" placeholder="URL de l'image ou logo">
                    <textarea id="gameDescription" placeholder="Description de votre expérience / avis..." required></textarea>
                    <button type="submit" class="btn-primary">Enregistrer dans l'Ønivers</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - L'Ønivers Pixel de Saik's L'Ønirique. Tous droits réservés.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
